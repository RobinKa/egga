name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.0
      - name: Install just
        run: |
          uv tool install rust-just==1.50.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: just sync-frozen
      - name: Check formatting
        run: just format-check
      - name: Run lint
        run: just lint
      - name: Run tests
        run: just test
      - name: Run examples
        run: just examples
      - name: Build package
        run: just build
      - name: Publish test
        if: github.event_name != 'pull_request'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.test_pypi_password }}
        run: just publish-test
      - name: Publish
        if: github.ref == 'refs/heads/master'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.pypi_password }}
        run: just publish
