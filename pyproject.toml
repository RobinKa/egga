[project]
name = "egga"
version = "0.1.9"
description = "Symbolic Geometric Algebra with E-Graphs "
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Robin Kahlow", email = "tora@warlock.ai" }]
keywords = [
    "geometric-algebra",
    "clifford-algebra",
    "simplification",
    "equations",
    "egraph",
    "egglog",
    "multi-vector",
    "para-vector",
    "mathematics",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",

    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",

    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "egglog>=0.7.0,<0.8.0",
]

[project.urls]
Homepage = "https://github.com/RobinKa/egga"
Repository = "https://github.com/RobinKa/egga"

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-xdist>=3.3.1,<4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["egga"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
